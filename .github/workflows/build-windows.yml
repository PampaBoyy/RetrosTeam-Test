name: Build Windows exe
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }
      - run: npm install
      - run: npx tauri icon src-tauri/icons/source.png
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build exe
        run: npm run tauri build -- --no-bundle
      - name: Package portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force RetrosTeam | Out-Null
          Copy-Item src-tauri/target/release/retrosteam.exe RetrosTeam/RetrosTeam.exe
          Set-Content -Encoding UTF8 RetrosTeam/LEIA-ME.txt "Abra RetrosTeam.exe. Tudo (emuladores, cores, jogos, saves, configuracoes) fica na pasta RetrosTeamData ao lado do exe. Para levar a outro PC, copie a pasta RetrosTeam inteira. Requer o WebView2 (ja vem no Windows 11)."
          Compress-Archive -Path RetrosTeam -DestinationPath RetrosTeam-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RetrosTeam-portable
          path: RetrosTeam-portable.zip
